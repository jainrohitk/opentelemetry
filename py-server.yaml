apiVersion: v1
kind: Namespace
metadata:
  name: python
---
apiVersion: v1
kind: Service
metadata:
  name: python-server
  namespace: python
spec:
  selector:
    app: python-server
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-server
  namespace: python
  labels:
    app: python-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-server
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"  # Important for enabling OpenTelemetry Python auto-instrumentation
      labels:
        app: python-server
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: python-server
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: python-server
          command: ["/bin/sh", "-ec"]
          args:
            - |
              PYTHONPATH= pip install --no-cache-dir Flask==3.1.3
              exec python -u -c '
              from flask import Flask, jsonify, request

              app = Flask(__name__)

              @app.route("/", defaults={"subpath": ""})
              @app.route("/<path:subpath>")
              def hello(subpath):
                  app.logger.warning("Handling request %s", request.path)
                  return jsonify(
                      message="Hello from Python!",
                      received_path=f"/{subpath}",
                      raw_path_info=request.path,
                      query_string=request.query_string.decode("utf-8"),
                      status_code=200,
                      headers=dict(request.headers),
                  )

              app.run(host="0.0.0.0", port=5000)
              '
          ports:
            - containerPort: 5000
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
