apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-client
  namespace: python
  labels:
    app: python-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-client
  template:
    metadata:
      annotations:
        instrumentation.opentelemetry.io/inject-python: "python-instrumentation"
      labels:
        app: python-client
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: python-client
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: python-client
          command: ["/bin/sh", "-ec"]
          args:
            - |
              PYTHONPATH= pip install --no-cache-dir Flask==3.1.3 requests==2.32.5
              exec python -u -c '
              import requests
              from flask import Flask, jsonify, request

              app = Flask(__name__)

              @app.route("/health")
              def health():
                  return jsonify(status="ok")

              @app.route("/", defaults={"subpath": ""})
              @app.route("/<path:subpath>")
              def call_backend(subpath):
                  app.logger.warning("Calling python-server for %s", request.path)
                  url = f"http://python-server.python.svc.cluster.local:5000/{subpath}"
                  try:
                      with requests.get(url, params=request.args, timeout=5) as response:
                          response.raise_for_status()
                          payload = response.json()
                  except requests.RequestException:
                      app.logger.exception("Request to python-server failed")
                      return jsonify(error="python-server request failed"), 502
                  return jsonify(service="python-client", downstream=payload)

              app.run(host="0.0.0.0", port=5000)
              '
          ports:
            - containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
